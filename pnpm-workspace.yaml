packages:
  - "apps/*"
  - "packages/*"
  - "tests"

# Supply-chain hardening (Semgrep p/default gate):
# - minimumReleaseAge: newly published versions must be at least 7 days old
#   before install (fastify@5.12.0 is explicitly excluded: audited clean on
#   2026-08-14 to close the advisory set; revisit at the next dependency
#   bump cycle).
# - trustPolicy: a future install may never silently downgrade these
#   security settings.
# - blockExoticSubdeps: transitive dependencies may not be installed from
#   exotic/untrusted sources.
minimumReleaseAge: 10080
# Published within the 7-day window at audit time (2026-08-14); all are
# covered by the clean `pnpm audit` record (0 advisories) and re-checked
# at the next dependency-bump cycle.
minimumReleaseAgeExclude:
  - fastify@5.12.0
  - "@fastify/ajv-compiler@4.0.6"
  - "@testing-library/user-event@14.6.4"
  - baseline-browser-mapping@2.11.13
  - browserslist@4.28.8
  - electron-to-chromium@1.5.404
  - nanoid@3.3.18
  - update-browserslist-db@1.3.1
trustPolicy: no-downgrade
# Forced by parent constraints; the registry's highest-trust version is a
# major the parents do not allow. Audit-clean (pnpm audit 0 advisories)
# and frozen-lockfile-pinned.
trustPolicyExclude:
  - pino@9.14.0 # fastify@5.12.0's supported logger line (pino 10 is a breaking major)
  - semver@6.3.1 # @babel/core@7.29.7 requires semver ^6
  - undici-types@6.21.0 # @types/node@22.15.3 pins the 6.x type mirror
blockExoticSubdeps: true

allowBuilds:
  esbuild: true
  # Wrangler's lockfile-pinned local runtime selector verifies and exposes the
  # matching optional platform binary. No other new package scripts are allowed.
  workerd: true
