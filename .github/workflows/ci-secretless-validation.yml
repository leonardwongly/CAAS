# Hermetic, secretless validation lane for the POC.
#
# The validate job is deterministic and offline except the pnpm registry
# fetch for the frozen lockfile. The semgrep and dependency-audit jobs are
# deliberately NOT deterministic: their rule/advisory data is fetched per
# run (semgrep registry / pnpm security-advisory endpoint), so they can
# newly flag — or newly miss — without a repo change. The secret-scan job is
# fully offline (rules embedded in the gitleaks binary). No job uses a
# credential, an Azure operation, a manual trigger, a workflow dispatch, or
# a phone-home. A failing step fails the run.
name: ci-secretless-validation

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.5.2 --activate
      - name: Install frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Static configuration
        run: pnpm run validate:config
      - name: Policy and offline repository validation
        run: pnpm run validate:policy
      - name: Typecheck
        run: pnpm run typecheck
      - name: Workspace lint (import boundaries and script hygiene)
        run: pnpm run lint
      - name: Unit and contract tests
        run: pnpm run test
      - name: Offline deterministic test suite
        run: pnpm run test:offline
      - name: Evidence tests and bundle validation
        run: pnpm run test:evidence
      - name: Loopback five-family lane (fixture-backed mechanics)
        run: pnpm run test:integration
      - name: Security measurement (hermetic)
        run: pnpm run test:security
      - name: Container definition smoke
        run: pnpm run container:smoke

  semgrep:
    # Standalone Semgrep SAST (no AppSec platform, no secrets, no findings
    # upload): scans the checked-out tree with the auto rule set for the
    # detected languages (TypeScript/JavaScript) and fails the job on any
    # finding. Metrics and the version check are disabled so the only
    # network egress is the rule-registry fetch. The image is digest-pinned
    # per repo convention (bump deliberately on review); the auto rule set
    # remains deliberately mutable — see the file header. On pull_request
    # this job also scans fork content: OSS rule execution cannot run
    # arbitrary code (that needs an explicit dangerous flag, not passed),
    # and the residual is trust in the registry rule content.
    name: Semgrep SAST scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan with Semgrep (auto rules, fail on findings)
        run: semgrep scan --config auto --error --metrics=off --oss-only --disable-version-check

  dependency-audit:
    # Networked production-dependency audit against the frozen lockfile: the
    # same invocation the blocked SEC-PACKAGE-AUDIT check prescribes. No
    # --ignore-registry-errors: an advisory-service outage fails the run
    # rather than passing silently. The raw JSON is uploaded as a run-bound
    # artifact; the check itself stays blocked until the authorized local
    # run's record is committed (CI has no write token).
    name: Dependency audit (networked, production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.5.2 --activate
      - name: Install frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (fail on any advisory)
        run: pnpm audit --prod --json > dependency-audit.json
      - name: Upload audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: error

  secret-scan:
    # Fully offline secret scan (rules embedded in the gitleaks binary; no
    # database fetch, no token, no PR commenting — the gitleaks-action is
    # deliberately avoided). Scans the checked-out tree including the
    # workflow files themselves. .gitleaks.toml allowlists exactly the four
    # placeholder/prose/test-double matches (verified clean locally); the
    # gitignored local .env is absent from CI checkouts and a committed .env
    # must still fail loudly.
    name: Secret scan (gitleaks, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan the tree for secrets (fail on findings)
        run: gitleaks dir . --exit-code=1 --redact --config .gitleaks.toml
