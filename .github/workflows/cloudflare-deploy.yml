# Cloudflare deployment is additive to the secretless validation and OCI
# subject-build workflows. Staging deploys from master; production requires an
# explicit manual dispatch. GitHub Environments scope deployment credentials.
name: cloudflare-deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target (production is protected by its GitHub Environment)
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SMOKE_URL: ${{ vars.CLOUDFLARE_SMOKE_URL }}
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.5.2 --activate

      - name: Install frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Build static assets
        run: pnpm --filter @flight-route-explorer/web run build

      - name: Deploy Worker, assets, and container
        run: |
          set -euo pipefail
          if [ "$TARGET" = "staging" ]; then
            pnpm exec wrangler deploy --env staging
          else
            pnpm exec wrangler deploy
          fi

      - name: Verify the deployed frontend and ready API
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_SMOKE_URL" || {
            echo 'CLOUDFLARE_SMOKE_URL must be configured as an Environment variable.' >&2
            exit 1
          }
          base_url="${CLOUDFLARE_SMOKE_URL%/}"
          curl --fail --show-error --location --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 60 "$base_url/" | grep -F '<div id="root"'
          curl --fail --show-error --location --retry 18 --retry-all-errors --retry-delay 10 \
            --connect-timeout 10 --max-time 240 "$base_url/api/v1/health/ready" | grep -F '"status":"ready"'
