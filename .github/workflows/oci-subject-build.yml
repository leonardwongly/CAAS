# Authoritative secretless OCI subject build (design section 0.1).
#
# Runs the SAME reproducible build path as the local lane
# (scripts/validation/build-oci.mjs against the digest-pinned Dockerfile),
# records the image ID and artifact hashes, and uploads the digest bundle.
# No credential is available in this workflow: the build never pushes to a
# registry and never touches a secret. The vulnerability-scan step fetches
# the Trivy database per run (the one deliberately non-deterministic input,
# like the semgrep rule registry). The bundle it uploads is the subject
# evidence for PG-03-EXACT-DIGEST; this workflow is triggered only by an
# authorized push or pull request, never manually.
name: oci-subject-build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-subject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build OCI subject (digest-pinned base, secretless)
        run: node scripts/validation/build-oci.mjs
      - name: Retain the OCI image tar (before --verify removes it)
        run: cp tmp/flight-route-explorer-oci.tar oci-subject.tar && ls -l oci-subject.tar
      - name: Verify image assertions
        run: node scripts/validation/build-oci.mjs --verify
      - name: Scan the built subject for HIGH/CRITICAL vulnerabilities
        run: |
          # Scan the Docker-archive tar (docker save) directly. The trivy
          # container is given only the archive, never the host Docker socket:
          # a malicious PR-supplied build script can no longer escape into the
          # host daemon through the scan container.
          docker run --rm \
            -v "$PWD:/work" -w /work \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format json --no-progress --input /work/oci-subject.tar > trivy-scan.json
      - name: Upload digest bundle, image tar, and scan report
        # The bundle is authoritative in-repo (docs/evidence/oci-digest-bundle-*.json,
        # committed by the authorized local lane); this run-bound artifact copy is a
        # convenience/verifiability record. Tolerate account-level Actions storage
        # quota exhaustion so a transient upload failure never blocks a merge.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-digest-bundle
          path: |
            docs/evidence/oci-digest-bundle-*.json
            oci-subject.tar
            trivy-scan.json
          if-no-files-found: error
